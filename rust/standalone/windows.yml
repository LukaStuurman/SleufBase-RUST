name: Rust Windows
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rust-windows-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - name: Test all native targets
        run: cargo test --locked --manifest-path rust/Cargo.toml --all-targets --jobs 2
      - name: Review with Clippy
        run: cargo clippy --locked --manifest-path rust/Cargo.toml --all-targets --jobs 2
      - name: Build optimized desktop app
        run: cargo build --locked --release --manifest-path rust/Cargo.toml --bin sleufbase-rust --jobs 2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser capture contracts
        run: node tools/test_kickthemap_capture.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Package and verify portable app
        shell: pwsh
        run: |
          python tools/test_native_preview_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/package_native_preview.py --binary rust/target/release/sleufbase-rust.exe --output rust/dist/portable-build --revision "$env:GITHUB_SHA"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tools/verify_native_preview.py rust/dist/portable-build/SleufBase-Rust-portable-preview.zip rust/dist/portable-build/SleufBase-Rust-portable-preview.sha256
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-Windows-portable-preview
          path: |
            rust/dist/portable-build/SleufBase-Rust-portable-preview.zip
            rust/dist/portable-build/SleufBase-Rust-portable-preview.sha256
          if-no-files-found: error
      - name: Compile separate preview installer
        shell: pwsh
        run: |
          choco install innosetup --version=6.7.1 -y --no-progress --allow-downgrade
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" rust/installer/SleufBase-Rust.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = 'rust/dist-installer/SleufBase-Rust-preview-Setup.exe'
          if ((Get-Item -LiteralPath $installer).Length -lt 500000) { throw 'Installer is onvolledig' }
          $checksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'rust/dist-installer/SleufBase-Rust-preview-Setup.sha256' -Encoding ascii -Value "$checksum  SleufBase-Rust-preview-Setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: SleufBase-Rust-Windows-installer-preview
          path: |
            rust/dist-installer/SleufBase-Rust-preview-Setup.exe
            rust/dist-installer/SleufBase-Rust-preview-Setup.sha256
          if-no-files-found: error
