name: Seed PDOK offline aerial overview (one-shot feature branch)

on:
  push:
    branches: [fix/offline-map-six-month-refresh-20261120]

permissions:
  contents: write

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and validate true georeferenced PDOK aerial imagery
        run: python3 tools/fetch_pdok_overview.py --output rust/assets/pdok_offline_overview.jpg
      - name: Commit the offline photo seed to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rust/assets/pdok_offline_overview.jpg
          if git diff --cached --quiet; then
            echo "Already up to date"
          else
            git commit -m "Bundle authentic PDOK low-resolution overview (CC BY 4.0)"
            git push origin HEAD:fix/offline-map-six-month-refresh-20261120
          fi
